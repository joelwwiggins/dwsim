[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dwsimpy"
version = "0.1.0"
description = "DWSIM Python"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
    "streamlit>=1.0.0",
]

[tool.setuptools.packages.find]
include = ["*"]